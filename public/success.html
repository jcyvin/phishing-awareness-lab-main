<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Success Logon</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at 50% 50%, #6d18d9 0%, #350b72 40%, #16052f 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(2px);
    z-index: 0;
  }

  .glow-one {
    width: 560px;
    height: 560px;
    left: -180px;
    top: -160px;
    background: radial-gradient(circle, rgba(214,112,255,0.55), rgba(133,25,235,0.30) 45%, transparent 70%);
  }

  .glow-two {
    width: 620px;
    height: 620px;
    right: -220px;
    bottom: -220px;
    background: radial-gradient(circle, rgba(224,126,255,0.45), rgba(125,20,210,0.25) 50%, transparent 70%);
  }

  .card {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 400px;
    background: linear-gradient(180deg, #ffffff 0%, #faf8ff 100%);
    color: #251044;
    border-radius: 24px;
    padding: 46px 40px 34px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }

  .logo {
    width: 68px;
    height: 68px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #7422e9, #3e087f);
    box-shadow: 0 15px 30px rgba(92,20,180,0.30);
  }

  .logo svg {
    width: 32px;
    height: 32px;
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  h1 {
    font-size: 24px;
    color: #2a0e50;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }

  p {
    font-size: 14px;
    color: #574c63;
    line-height: 1.6;
  }

  p strong {
    color: #2a0e50;
  }

  .meta {
    margin-top: 18px;
    padding: 16px 18px;
    background: #f5f0fc;
    border: 1px solid #e4d5f7;
    border-radius: 14px;
    text-align: left;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #574c63;
  }

  .meta-row + .meta-row {
    margin-top: 10px;
  }

  .meta-row span:first-child {
    color: #8a7e99;
  }

  .meta-row span:last-child {
    font-weight: bold;
    color: #2a0e50;
  }

  .warning {
    margin-top: 20px;
    padding: 10px 14px;
    background: #fff7e6;
    border: 1px solid #f4dfa8;
    border-radius: 10px;
    font-size: 12px;
    color: #b45309;
    font-weight: bold;
  }

  .dashboard-button {
    width: 100%;
    height: 50px;
    margin-top: 26px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #5d12bc, #8b28e8);
    color: #ffffff;
    font-size: 14.5px;
    font-weight: bold;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(98,20,190,0.28);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .dashboard-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(98,20,190,0.35);
  }

  .training-notice {
    margin-top: 24px;
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 2px;
    color: #b6acc4;
  }
</style>
</head>

<body>

  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>

  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"></polyline></svg>
    </div>

    <h1>Accessed!</h1>
    <p>Welcome, <strong id="username">user</strong>.</p>

    <div class="meta">
      <div class="meta-row">
        <span>Login time</span>
        <span id="timestamp">N/A</span>
      </div>
      <div class="meta-row">
        <span>Status</span>
        <span>Authenticated</span>
      </div>
    </div>

    <button class="dashboard-button" type="button">Continue to Dashboard</button>

    <div class="training-notice">POWERED BY LSS</div>
  </div>

  <script src="success.js"></script>

</body>
</html>
